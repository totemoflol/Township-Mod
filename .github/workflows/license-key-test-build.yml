name: Build ToT Tools Licence Test APK
on:
  push:
    branches:
      - license-keys-test
    paths:
      - 'android-client/**'
      - '.github/workflows/license-key-test-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Build licence test APK
    runs-on: ubuntu-latest
    env:
      TOT_LICENSE_API_URL: ${{ vars.TOT_LICENSE_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build test APK
        working-directory: android-client
        run: gradle --no-daemon -PtotLicenseApiUrl="$TOT_LICENSE_API_URL" :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ToT-Tools-Licence-Key-Test
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish licence-key preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "android-client/app/build/outputs/apk/debug/app-debug.apk" "ToT-Tools-Licence-Test.apk"
          TAG="tot-tools-license-preview-0.4.0"
          NOTES="Preview build for testing the TOT_XXXXX licence-key screen and one-device activation flow. IMPORTANT: the licence backend is not deployed yet in this preview; activation and key generation are not live. Do not use for sales or customer installs. The normal ToT Tools release is unchanged."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "ToT-Tools-Licence-Test.apk" --clobber
          else
            gh release create "$TAG" "ToT-Tools-Licence-Test.apk" --title "ToT Tools Licence Preview 0.4.0" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"
