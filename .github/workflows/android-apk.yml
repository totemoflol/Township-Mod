name: Build ToT Tools APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android-client/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Compile ToT Tools
        working-directory: android-client
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToT-Tools-Android-APK
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android-client/app/build/outputs/apk/debug/app-debug.apk"
          TAG="tot-tools-v1.1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#ToT-Tools.apk" --clobber
          else
            gh release create "$TAG" "$APK#ToT-Tools.apk" --title "ToT Tools v1.1.0" --notes "ToT Tools Android category editor. Android 10 or newer."
          fi
