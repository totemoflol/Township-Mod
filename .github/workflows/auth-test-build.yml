name: Build ToT Tools Auth Test APK
on:
  push:
    branches:
      - auth-test-mode
    paths:
      - 'android-client/**'
      - '.github/workflows/auth-test-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build auth test APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build test APK
        working-directory: android-client
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ToT-Tools-Auth-Test-APK
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
