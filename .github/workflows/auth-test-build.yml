name: Build ToT Tools Auth Test APK
on:
  push:
    branches:
      - auth-test-mode
    paths:
      - 'android-client/**'
      - '.github/workflows/auth-test-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Build auth test APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build test APK
        working-directory: android-client
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ToT-Tools-Auth-Test-APK
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish test APK as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "android-client/app/build/outputs/apk/debug/app-debug.apk" "ToT-Tools-Auth-Test.apk"
          TAG="tot-tools-auth-test-0.4.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "ToT-Tools-Auth-Test.apk" --clobber
          else
            gh release create "$TAG" "ToT-Tools-Auth-Test.apk" --title "ToT Tools Auth Test 0.4.0" --notes "Separate test build for local authentication and premium feature-gating tests. Uses demo-only local accounts. No real login server or payment processing is included. Do not use as a paid production app." --prerelease
          fi
